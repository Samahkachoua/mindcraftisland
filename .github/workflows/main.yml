name: Keep Render App Warm
on:
  schedule:
    - cron: '*/3 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you trigger it manually too, for testing
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -s -o /dev/null https://mindcraftisland.onrender.com
